<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlídací pes na auta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceee9;--ink:#17211d;--mute:#5d6b65;--line:#c9d0ca;--card:#f8f9f6;--green:#0f3d2e;--green2:#1d6a4f;--new:#d9480f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) url(pozadi.jpg) no-repeat fixed right bottom/cover;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{padding:40px 20px 24px;max-width:1000px;margin:auto}
h1{font:700 clamp(40px,8vw,72px)/.95 'Barlow Condensed',Impact,sans-serif;margin:0;color:var(--green)}
header p{max-width:60ch;color:var(--ink);margin:12px 0 0;background:rgba(236,238,233,.8);padding:6px 10px;border-radius:4px;display:inline-block}
main{max-width:1000px;margin:auto;padding:0 20px 60px;display:grid;gap:28px;grid-template-columns:320px 1fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
h2{font:600 22px 'Barlow Condensed',sans-serif;margin:0 0 12px}
form,.card{background:rgba(248,249,246,.93);backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:6px;padding:18px}
form{align-self:start;display:grid;gap:10px}
label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:600 14px Barlow,sans-serif;cursor:pointer;border:1px solid var(--green);background:transparent;color:var(--green);border-radius:4px;padding:8px 12px;text-decoration:none;display:inline-block}
button.main,.btn.main{background:var(--green);color:var(--bg)}
button:hover,.btn:hover{filter:brightness(1.15)}
.list{display:grid;gap:14px;align-content:start}
.card h3{font:700 26px 'Barlow Condensed',sans-serif;margin:0}
.spec{color:var(--mute);font-size:14px;margin:2px 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--new);border:1px solid var(--new);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:middle}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.note{font-size:14px;border-left:3px solid var(--line);padding-left:10px;margin:8px 0;white-space:pre-wrap}
details{font-size:14px;margin-top:8px}
summary{cursor:pointer;color:var(--mute)}
details label{margin-top:8px}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.foot button{font-size:13px;padding:4px 8px}
.empty{background:rgba(248,249,246,.93);color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center}
.alerts{font-size:14px;color:var(--mute);margin-top:6px}
.alerts a{color:var(--green)}
</style>
</head>
<body>
<header>
<h1>Hlídací pes</h1>
<p>Uložte si hledání aut a otevřete je jedním klikem na AutoScout24, mobile.de a Sauto.cz. Data zůstávají jen ve vašem prohlížeči.</p>
</header>
<main>
<form id="f">
<h2>Nové hledání</h2>
<label>Název hledání<input id="name" placeholder="např. Porsche GT3 RS" required></label>
<div class="row">
<label>Značka<input id="make" placeholder="porsche" required></label>
<label>Model<input id="model" placeholder="911"></label>
</div>
<label>Verze nebo klíčové slovo<input id="trim" placeholder="GT3 RS"></label>
<div class="row">
<label>Cena do (EUR)<input id="priceTo" type="number" min="0"></label>
<label>Rok od<input id="yearFrom" type="number" min="1950" max="2030"></label>
</div>
<div class="row">
<label>Nájezd do (km)<input id="kmTo" type="number" min="0"></label>
<label>Cílová cena (EUR)<input id="target" type="number" min="0"></label>
</div>
<label>Poznámka<textarea id="note" rows="2"></textarea></label>
<button class="main" type="submit">Přidat hledání</button>
<div class="alerts">Upozornění na nové inzeráty zapnete přímo v bazarech: <a href="https://www.autoscout24.com" target="_blank" rel="noopener">AutoScout24</a>, <a href="https://www.mobile.de" target="_blank" rel="noopener">mobile.de</a>, <a href="https://www.sauto.cz" target="_blank" rel="noopener">Sauto.cz</a>. Uložte tam hledání a zapněte e-mail.</div>
</form>
<section class="list" id="list" aria-live="polite"></section>
</main>
<script>
const KEY="hlidaci-pes-v1";
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>String(s||"").trim().toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
const SITES=[["as24","AutoScout24"],["mobile","mobile.de"],["sauto","Sauto.cz"]];
function url(it,k){
  const c=(it.custom||{})[k];
  if(c&&/^https?:\/\//.test(c))return c;
  if(k==="as24"){
    let u="https://www.autoscout24.com/lst/"+slug(it.make)+(it.model?"/"+slug(it.model):"");
    const p=new URLSearchParams({sort:"age",desc:"1"});
    if(it.priceTo)p.set("priceto",it.priceTo);
    if(it.yearFrom)p.set("fregfrom",it.yearFrom);
    if(it.kmTo)p.set("kmto",it.kmTo);
    return u+"?"+p;
  }
  if(k==="mobile"){
    const q=["site:suchen.mobile.de",it.make,it.model,it.trim].filter(Boolean).join(" ");
    return "https://www.google.com/search?q="+encodeURIComponent(q);
  }
  return "https://www.sauto.cz/inzerce/osobni/"+slug(it.make)+(it.model?"/"+slug(it.model):"");
}
function openAll(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  SITES.forEach(([k])=>window.open(url(it,k),"_blank","noopener"));
  it.checked=Date.now();save();render();
}
function render(){
  const L=$("list");
  if(!items.length){L.innerHTML='<div class="empty">Zatím nehlídáte žádné auto. Vyplňte formulář a přidejte první hledání.</div>';return}
  L.innerHTML=items.map(it=>{
    const specs=[it.trim,it.yearFrom&&"od "+it.yearFrom,it.kmTo&&"do "+Number(it.kmTo).toLocaleString("cs-CZ")+" km",it.priceTo&&"do "+Number(it.priceTo).toLocaleString("cs-CZ")+" EUR"].filter(Boolean).join(", ");
    const days=it.checked?Math.floor((Date.now()-it.checked)/864e5):null;
    const when=it.checked?"Naposledy zkontrolováno "+new Date(it.checked).toLocaleDateString("cs-CZ"):"Ještě nezkontrolováno";
    const stale=days===null||days>=1?'<span class="tag">čas zkontrolovat</span>':"";
    return `<article class="card">
<h3>${esc(it.name)}${stale}</h3>
<div class="spec">${esc([it.make,it.model].filter(Boolean).join(" "))}${specs?" · "+esc(specs):""}${it.target?" · cíl "+Number(it.target).toLocaleString("cs-CZ")+" EUR":""}</div>
<div class="btns">
<button class="main" data-open="${it.id}">Otevřít vše</button>
${SITES.map(([k,n])=>`<a class="btn" href="${esc(url(it,k))}" target="_blank" rel="noopener">${n}</a>`).join("")}
</div>
${it.note?`<div class="note">${esc(it.note)}</div>`:""}
<details><summary>Vlastní odkazy z bazarů</summary>
<p style="color:var(--mute);margin:6px 0">Nastavte filtry přímo na webu bazaru a zkopírujte adresu sem. Použije se místo automatického odkazu.</p>
${SITES.map(([k,n])=>`<label>${n}<input data-c="${it.id}|${k}" value="${esc((it.custom||{})[k]||"")}" placeholder="https://..."></label>`).join("")}
</details>
<div class="foot"><span>${when}</span><button data-del="${it.id}">Smazat</button></div>
</article>`}).join("");
}
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const g=id=>$(id).value.trim();
  items.unshift({id:"i"+Date.now(),name:g("name"),make:g("make"),model:g("model"),trim:g("trim"),priceTo:g("priceTo"),yearFrom:g("yearFrom"),kmTo:g("kmTo"),target:g("target"),note:g("note"),custom:{},checked:null});
  save();e.target.reset();render();
});
$("list").addEventListener("click",e=>{
  const o=e.target.dataset.open,d=e.target.dataset.del;
  if(o)openAll(o);
  if(d&&confirm("Smazat toto hledání?")){items=items.filter(x=>x.id!==d);save();render()}
});
$("list").addEventListener("change",e=>{
  const c=e.target.dataset.c;if(!c)return;
  const [id,k]=c.split("|");const it=items.find(x=>x.id===id);
  if(it){it.custom=it.custom||{};it.custom[k]=e.target.value.trim();save();render()}
});
render();
</script>
</body>
</html>
